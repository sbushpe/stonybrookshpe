# Tooling configuration for the backend. There is no build step and nothing is
# published, so this file carries tool settings only — no packaging metadata.

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Assertions are the point of a test file.
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
