<!--Syling and HTML for reuseable footer web component-->

<template id="footer-style">
    
    <style>
        :host{
            display: block;
            width: 100%;
            box-sizing: border-box;
        }
        .footer-grid{
            background-color: #001f59;
            padding: 32px 4% 24px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            color:white;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }
        .footer-col{
            font-family: Arial, sans-serif;
            color:#ffffff;
            text-align: center;
            text-decoration: none;
            min-width: 0;
        }

        .footer-col a{
            color:white;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-weight: bold;

        }
        
        .social-title{
            padding-bottom: 3%;
        }

        .socials{
            display: flex;
            gap: 14px;
            align-items: center;
            margin-top: 10px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }
        .socials a{
            display: inline-flex;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            align-items: center;
            justify-content: center;
        }
        .socials a:hover, .socials a:focus-visible {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 0.18);
        }
        .social-icon{
            width: 20px;
            height: 20px;
            display: block;
        }
        .footer-col img{
            max-width: 100%;
            height: auto;
        }
        .footer-col h1{
            font-size: 1.5rem;
            line-height: 1.2;
            margin-bottom: 10px;
            word-break: break-word;
        }

        @media (max-width: 900px){
            .footer-grid{
                grid-template-columns: 1fr;
            }
        }

    </style>

    
    <div class="footer-grid">
        <!--First col. 300     100-->

        <div class="footer-col">

        </div>

        <!--Second col-->
        <div class="footer-col">

            <div class="socials">
                <a href="https://www.youtube.com/channel/UC4ZKTRm4mI8-H77zAZaNckg" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
                    <img class="social-icon" src="media/icons/youtube.svg" alt="YouTube">
                </a>
                <a href="https://www.instagram.com/stonybrookshpe/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                    <img class="social-icon" src="media/icons/instagram.svg" alt="Instagram">
                </a>
                <a href="https://www.linkedin.com/company/shpe-at-stony-brook-university/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
